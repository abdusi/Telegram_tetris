<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Тетрис</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600;700&display=swap');

  :root {
    --bg: #0d0a1a;
    --panel: #161029;
    --grid-line: #241c3d;
    --text: #d9d3ff;
    --muted: #6e63a3;
    --accent: #ff2e88;
    --accent-glow: rgba(255, 46, 136, 0.5);

    --i: #2de2e6;
    --o: #ffd23f;
    --t: #b967ff;
    --s: #39ff88;
    --z: #ff4d5e;
    --j: #4d7cff;
    --l: #ff9f2e;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at top, #1a1330 0%, #0d0a1a 60%);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    min-height: 100%;
    height: var(--tg-vh, 100%);
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(16px, 4vw, 24px);
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent-glow), 0 0 24px var(--accent-glow);
    letter-spacing: 3px;
    margin: 0;
  }

  .layout {
    display: flex;
    gap: 18px;
    align-items: flex-start;
  }

  .board-wrap {
    position: relative;
    border: 2px solid #3a2d5c;
    box-shadow: 0 0 0 4px var(--panel), 0 0 30px rgba(255,46,136,0.12);
    border-radius: 6px;
    overflow: hidden;
  }

  canvas#board { display: block; background: var(--bg); }

  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 130px;
  }

  .card {
    background: var(--panel);
    border: 1px solid #2a2148;
    border-radius: 6px;
    padding: 10px;
  }

  .card .label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .card .value {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  canvas#next {
    display: block;
    background: var(--bg);
    border-radius: 4px;
    margin-top: 4px;
  }

  .scanlines {
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(8, 6, 16, 0.9);
    text-align: center;
    padding: 20px;
  }

  .overlay.show { display: flex; }

  .overlay h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(13px, 3.4vw, 18px);
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent-glow);
    margin: 0;
  }

  .overlay p { margin: 0; color: var(--muted); font-size: 13px; }

  button {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 4px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  button:hover { background: var(--accent); color: #0d0a1a; }
  button:focus-visible { outline: 2px solid var(--i); outline-offset: 2px; }

  .hint {
    font-size: 11px;
    color: var(--muted);
    max-width: 480px;
    text-align: center;
    line-height: 1.6;
  }

  .touch-controls {
    display: none;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(2, 50px);
    gap: 8px;
  }

  .touch-controls button {
    width: 50px; height: 50px; padding: 0; font-size: 18px; border-radius: 8px;
  }

  .tc-rotate { grid-column: 2; grid-row: 1; }
  .tc-left { grid-column: 1; grid-row: 2; }
  .tc-down { grid-column: 2; grid-row: 2; }
  .tc-right { grid-column: 3; grid-row: 2; }

@media (hover: none) and (pointer: coarse) {
    .touch-controls { display: grid; }
    .hint.desktop-only { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scanlines { display: none; }
  }
</style>
</head>
<body>

  <h1>ТЕТРИС</h1>

  <div class="layout">
    <div class="board-wrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="scanlines"></div>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">ИГРА ОКОНЧЕНА</h2>
        <p id="overlay-sub">Счёт: 0</p>
        <button id="restart-btn">Играть снова</button>
        <button id="send-score-btn" style="display:none;">Отправить результат боту</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="card">
        <div class="label">СЧЁТ</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="card">
        <div class="label">УРОВЕНЬ</div>
        <div class="value" id="level">1</div>
      </div>
      <div class="card">
        <div class="label">ЛИНИИ</div>
        <div class="value" id="lines">0</div>
      </div>
      <div class="card">
        <div class="label">ДАЛЕЕ</div>
        <canvas id="next" width="90" height="90"></canvas>
      </div>
    </div>
  </div>

  <p class="hint desktop-only">← → — движение · ↑ / Z — поворот · ↓ — мягкое падение · Пробел — жёсткое падение · P — пауза</p>

  <div class="touch-controls">
    <button class="tc-rotate" data-action="rotate">⟳</button>
    <button class="tc-left" data-action="left">◀️</button>
    <button class="tc-down" data-action="down">▼</button>
    <button class="tc-right" data-action="right">▶️</button>
  </div>

<script>
(function () {
  // --- Telegram Mini App integration ---
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.setHeaderColor) { try { tg.setHeaderColor('#0d0a1a'); } catch (e) {} }
    if (tg.setBackgroundColor) { try { tg.setBackgroundColor('#0d0a1a'); } catch (e) {} }

    const applyViewportHeight = () => {
      const h = tg.viewportStableHeight || tg.viewportHeight || window.innerHeight;
      document.documentElement.style.setProperty('--tg-vh', h + 'px');
    };
    applyViewportHeight();
    tg.onEvent && tg.onEvent('viewportChanged', applyViewportHeight);
    window.addEventListener('resize', applyViewportHeight);
  }

  function sendScoreToBot(payload) {
    if (tg && tg.sendData) {
      try { tg.sendData(JSON.stringify(payload)); } catch (e) {}
    }
  }
  // --- end Telegram integration ---

  const COLS = 10, ROWS = 20, CELL = 30;
  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nctx = nextCanvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlaySub = document.getElementById('overlay-sub');
  const restartBtn = document.getElementById('restart-btn');
  const sendScoreBtn = document.getElementById('send-score-btn');

  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  const COLORS = {
    I: getVar('--i'), O: getVar('--o'), T: getVar('--t'),
    S: getVar('--s'), Z: getVar('--z'), J: getVar('--j'), L: getVar('--l'),
  };

  const SHAPES = {
    I: [
      [[0,1],[1,1],[2,1],[3,1]],
      [[2,0],[2,1],[2,2],[2,3]],
      [[0,2],[1,2],[2,2],[3,2]],
      [[1,0],[1,1],[1,2],[1,3]],
    ],
    O: [
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
    ],
    T: [
      [[1,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[2,1],[1,2]],
      [[1,0],[0,1],[1,1],[1,2]],
    ],
    S: [
      [[1,0],[2,0],[0,1],[1,1]],
      [[1,0],[1,1],[2,1],[2,2]],
      [[1,1],[2,1],[0,2],[1,2]],
      [[0,0],[0,1],[1,1],[1,2]],
    ],
    Z: [
      [[0,0],[1,0],[1,1],[2,1]],
      [[2,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[1,2],[2,2]],
      [[1,0],[0,1],[1,1],[0,2]],
    ],
    J: [
      [[0,0],[0,1],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[1,2]],
      [[0,1],[1,1],[2,1],[2,2]],
      [[1,0],[1,1],[0,2],[1,2]],
    ],
    L: [
      [[2,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[1,2],[2,2]],
      [[0,1],[1,1],[2,1],[0,2]],
      [[0,0],[1,0],[1,1],[1,2]],
    ],
  };
  const SHAPE_NAMES = Object.keys(SHAPES);

  let grid, current, bag, nextPieceName;
  let score, level, lines, dropInterval, dropTimer, paused, gameOver, lastTime;

  function newGrid() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  function refillBag() {
    const arr = [...SHAPE_NAMES];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function nextFromBag() {
    if (bag.length === 0) bag = refillBag();
    return bag.pop();
  }

  function spawnPiece(name) {
    return { name, rotation: 0, x: 0, y: -2 };
  }

  function cellsOf(piece) {
    return SHAPES[piece.name][piece.rotation].map(([cx, cy]) => ({
      x: piece.x + cx,
      y: piece.y + cy,
    }));
  }

  function collides(piece) {
    return cellsOf(piece).some(({ x, y }) => {
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y < 0) return false;
      return grid[y][x] !== null;
    });
  }

  function lockPiece() {
    cellsOf(current).forEach(({ x, y }) => {
      if (y >= 0) grid[y][x] = current.name;
    });
    clearLines();
    current = spawnPiece(nextPieceName);
    nextPieceName = nextFromBag();
    drawNextPreview();
    if (collides(current)) {
      endGame();
    }
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(cell => cell !== null)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      level = 1 + Math.floor(lines / 10);
      dropInterval = Math.max(120, 800 - (level - 1) * 60);
      scoreEl.textContent = score;
      linesEl.textContent = lines;
      levelEl.textContent = level;
    }
  }

  function tryMove(dx, dy) {
    const moved = { ...current, x: current.x + dx, y: current.y + dy };
    if (!collides(moved)) {
      current = moved;
      return true;
    }
    return false;
  }

  function tryRotate() {
    const rotated = { ...current, rotation: (current.rotation + 1) % 4 };
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      const attempt = { ...rotated, x: rotated.x + k };
      if (!collides(attempt)) {
        current = attempt;
        return;
      }
    }
  }

  function hardDrop() {
    let dropped = 0;
    while (tryMove(0, 1)) dropped++;
    score += dropped * 2;
    scoreEl.textContent = score;
    lockPiece();
  }

  function endGame() {
    gameOver = true;
    overlayTitle.textContent = 'ИГРА ОКОНЧЕНА';
    overlaySub.textContent = `Счёт: ${score} · Уровень: ${level} · Линии: ${lines}`;
    overlay.classList.add('show');
    if (tg && tg.sendData) {
      sendScoreBtn.style.display = 'inline-block';
    }
  }

  function resetGame() {
    grid = newGrid();
    bag = refillBag();
    current = spawnPiece(nextFromBag());
    nextPieceName = nextFromBag();
    score = 0; level = 1; lines = 0;
    dropInterval = 800;
    dropTimer = 0;
    paused = false;
    gameOver = false;
    scoreEl.textContent = score;
    levelEl.textContent = level;
    linesEl.textContent = lines;
    overlay.classList.remove('show');
    sendScoreBtn.style.display = 'none';
    drawNextPreview();
  }

  function drawCellRect(context, x, y, size, color) {
    context.fillStyle = color;
    context.shadowColor = color;
    context.shadowBlur = 8;
    context.fillRect(x + 1, y + 1, size - 2, size - 2);
    context.shadowBlur = 0;
    context.strokeStyle = 'rgba(0,0,0,0.35)';
    context.strokeRect(x + 1, y + 1, size - 2, size - 2);
  }

  function drawBoard() {
    ctx.fillStyle = getVar('--bg');
    ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

    ctx.strokeStyle = getVar('--grid-line');
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
    }

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const cell = grid[y][x];
        if (cell) drawCellRect(ctx, x * CELL, y * CELL, CELL, COLORS[cell]);
      }
    }

    cellsOf(current).forEach(({ x, y }) => {
      if (y >= 0) drawCellRect(ctx, x * CELL, y * CELL, CELL, COLORS[current.name]);
    });

    if (paused && !gameOver) {
      ctx.fillStyle = 'rgba(8,6,16,0.75)';
      ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
      ctx.fillStyle = getVar('--text');
      ctx.font = "bold 22px 'JetBrains Mono', monospace";
      ctx.textAlign = 'center';
      ctx.fillText('ПАУЗА', boardCanvas.width / 2, boardCanvas.height / 2);
    }
  }

  function drawNextPreview() {
    nctx.fillStyle = getVar('--bg');
    nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    const shape = SHAPES[nextPieceName][0];
    const size = 18;
    const offsetX = (nextCanvas.width - 4 * size) / 2;
    const offsetY = (nextCanvas.height - 4 * size) / 2;
    shape.forEach(([cx, cy]) => {
      drawCellRect(nctx, offsetX + cx * size, offsetY + cy * size, size, COLORS[nextPieceName]);
    });
  }

  function loop(time) {
    if (!lastTime) lastTime = time;
    const delta = time - lastTime;
    lastTime = time;

    if (!gameOver && !paused) {
      dropTimer += delta;
      if (dropTimer >= dropInterval) {
        dropTimer = 0;
        if (!tryMove(0, 1)) {
          lockPiece();
        }
      }
    }

    drawBoard();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyP') {
      e.preventDefault();
      if (!gameOver) paused = !paused;
      return;
    }
    if (gameOver || paused) return;

    switch (e.code) {
      case 'ArrowLeft':
        e.preventDefault(); tryMove(-1, 0); break;
      case 'ArrowRight':
        e.preventDefault(); tryMove(1, 0); break;
      case 'ArrowDown':
        e.preventDefault();
        if (tryMove(0, 1)) { score += 1; scoreEl.textContent = score; }
        break;
      case 'ArrowUp':
      case 'KeyZ':
        e.preventDefault(); tryRotate(); break;
      case 'Space':
        e.preventDefault(); hardDrop(); break;
    }
  });

  document.querySelectorAll('.touch-controls button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (gameOver || paused) return;
      const action = btn.dataset.action;
      if (action === 'left') tryMove(-1, 0);
      if (action === 'right') tryMove(1, 0);
      if (action === 'down') tryMove(0, 1);
      if (action === 'rotate') tryRotate();
    });
  });

  restartBtn.addEventListener('click', resetGame);
  sendScoreBtn.addEventListener('click', () => {
    sendScoreToBot({ score, level, lines });
    if (tg && tg.close) tg.close();
  });

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
