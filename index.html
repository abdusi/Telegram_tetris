<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Игры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600;700&display=swap');

  :root {
    --bg: #0d0a1a;
    --panel: #161029;
    --text: #d9d3ff;
    --muted: #6e63a3;
    --accent: #ff2e88;
    --accent-glow: rgba(255, 46, 136, 0.5);
    --tetris: #b967ff;
    --snake: #39ff88;
    --ttt: #2de2e6;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at top, #1a1330 0%, #0d0a1a 60%);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }

  #menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    height: 100%;
    padding: 24px;
  }

  #menu h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(16px, 5vw, 22px);
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent-glow), 0 0 24px var(--accent-glow);
    letter-spacing: 2px;
    margin: 0 0 8px;
    text-align: center;
  }

  .game-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: min(360px, 90vw);
  }

  .game-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    border: 2px solid var(--card-color, var(--accent));
    border-radius: 10px;
    padding: 16px 18px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
    text-align: left;
  }

  .game-btn:active { transform: scale(0.97); background: #1d1738; }

  .game-btn .icon {
    font-size: 26px;
    filter: drop-shadow(0 0 6px var(--card-color, var(--accent)));
  }

  .game-btn .label { flex: 1; }
  .game-btn .label small {
    display: block;
    font-weight: 400;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  #tetris-btn { --card-color: var(--tetris); }
  #snake-btn { --card-color: var(--snake); }
  #ttt-btn { --card-color: var(--ttt); }

  #slots-btn { --card-color: #ffd700; }
  #flappy-btn { --card-color: #4dd0ff; }


  #game-frame {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: var(--bg);
  }

  #back-btn {
    display: none;
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 10px;
    z-index: 10;
    background: rgba(22, 16, 41, 0.85);
    color: var(--text);
    border: 1px solid #2a2148;
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  body.in-game #menu { display: none; }
  body.in-game #game-frame { display: block; }
  body.in-game #back-btn.show-fallback { display: block; }
</style>
</head>
<body>

  <div id="menu">
    <h1>ВЫБЕРИ ИГРУ</h1>
    <div class="game-list">
      <button class="game-btn" id="tetris-btn">
        <span class="icon">🧱</span>
        <span class="label">Тетрис<small>Классическая головоломка</small></span>
      </button>
      <button class="game-btn" id="snake-btn">
        <span class="icon">🐍</span>
        <span class="label">Змейка<small>Собери как можно больше очков</small></span>
      </button>
      <button class="game-btn" id="ttt-btn">
        <span class="icon">✖️</span>
        <span class="label">Крестики-нолики<small>Сразись с компьютером</small></span>
      </button>
      <button class="game-btn" id="slots-btn">
        <span class="icon">🎰</span>
        <span class="label">Три в ряд<small>Казино • баланс 10 000</small></span>
      </button>
      <button class="game-btn" id="flappy-btn">
        <span class="icon">🐤</span>
        <span class="label">Flappy Bird<small>Пролети как можно дальше</small></span>
      </button>
    </div>
  </div>

  <button id="back-btn">← Меню</button>
  <iframe id="game-frame" title="game"></iframe>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { document.documentElement.style.background = tg.themeParams.bg_color || ''; } catch (e) {}
  }

  const frame = document.getElementById('game-frame');
  const backBtn = document.getElementById('back-btn');

  function b64ToUtf8(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function getGameHtml(key) {
    const el = document.getElementById('game-data-' + key);
    return b64ToUtf8(el.textContent.trim());
  }

  function openGame(key) {
    frame.srcdoc = getGameHtml(key);
    document.body.classList.add('in-game');
    if (tg && tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(closeGame);
      backBtn.classList.remove('show-fallback');
    } else {
      backBtn.classList.add('show-fallback');
    }
  }

  function closeGame() {
    document.body.classList.remove('in-game');
    frame.srcdoc = 'about:blank';
    if (tg && tg.BackButton) {
      tg.BackButton.hide();
      tg.BackButton.offClick(closeGame);
    }
  }

  document.getElementById('tetris-btn').addEventListener('click', () => openGame('tetris'));
  document.getElementById('snake-btn').addEventListener('click', () => openGame('snake'));
  document.getElementById('ttt-btn').addEventListener('click', () => openGame('ttt'));
  document.getElementById('slots-btn').addEventListener('click', () => openGame('slots'));
  document.getElementById('flappy-btn').addEventListener('click', () => openGame('flappy'));
  backBtn.addEventListener('click', closeGame);
})();
</script>
